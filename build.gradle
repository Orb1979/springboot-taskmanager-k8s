plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'TaskManager'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // Spring-Dotenv integrates dotenv-java library into Spring by exposing .env files as a Spring PropertySource.
    implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'

    // --- Kubernetes Client ---
    implementation 'io.fabric8:kubernetes-client:7.8.0'
    // this is required for EC keys used in Kubernetes API authentication
    // implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'
    // implementation 'org.bouncycastle:bcprov-jdk18on:1.83'

    // kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // --- Testing Kubernetes -
//    testImplementation 'io.fabric8:kubernetes-server-mock:7.5.2'
//    testImplementation 'org.mockito:mockito-junit-jupiter:5.15.2'
//    // Jackson (Compatible with Fabric8 7.x internal requirements)
//    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.5'
//    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.18.5'
//    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.5'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
