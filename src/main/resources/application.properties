spring.application.name=TaskManager

# db
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# flyway
logging.level.org.springframework.boot.autoconfigure.flyway=WARN
logging.level.org.flywaydb=WARN

# Controller -> Service -> Transaction ends (hibernate session is closed)
spring.jpa.open-in-view=false

# Kubernetes INTERNAL-IP is the node's IP on the underlying host network
task.execution.kafka-bootstrap-servers=${KUBERNETES_INTERNAL_IP:NOT_FOUND}:9093

# kubernetes context e.g default, rancher-desktop, GKE
kubernetes.context="rancher-desktop"

# kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=task-manager
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.taskmanager.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.taskmanager.kafka.TaskStatusEvent

logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.springframework.kafka=WARN

# Optional: If you want to disable type headers and trust all packages (not recommended for production)
# spring.kafka.consumer.properties.spring.json.use.type.headers=false
# spring.kafka.consumer.properties.spring.json.trusted.packages=*